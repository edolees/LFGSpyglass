# Builds the add-on zip and uploads it to CurseForge (and a GitHub release) when a version tag
# such as 1.2.0 is pushed. Needs the CF_API_KEY repository secret and ## X-Curse-Project-ID in
# the TOC. Packaging rules are in .pkgmeta. Actions are pinned to exact commits; update them on purpose.
name: Release

on:
  push:
    tags:
      - "[0-9]*" # version tags without a "v" (1.2.0): the tag is the in-game version

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pinned)
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1 (pinned: gets CF_API_KEY)
